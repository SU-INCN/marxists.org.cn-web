<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>404</title>
    <style>
        body {
            font-family: "FangSong", sans-serif;
            text-align: center;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 {
            font-size: 3rem;
        }
        p {
            font-size: 1.2rem;
        }
        a {
            font-size: 1.2rem;
            color: #007bff;
            text-decoration: none;
            display: block;
            margin: 10px 0;
        }
        .countdown {
            font-size: 1.5rem;
            color: red;
            width: 50px;
            display: inline-block;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>页面未找到</p>
    <p>页面将在 <span class="countdown">09</span> 秒后跳转到 <a href="https://marxists.org.cn/" target="_blank">中文马克思主义文库</a></p>
    <a href="/">返回首页</a>
    <a href="https://incn.su/" target="_blank">苏在中</a>
    <script>
        let c = 9;
        let e = document.querySelector('.countdown');
        function u() {
            e.textContent = c.toString().padStart(2, '0');
            c--;
            if (c < 0) {
                clearInterval(i);
                location.href = "https://marxists.org.cn/";
            }
        }
        const i = setInterval(u, 1000);
    </script>
    <script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
    <script>
        LA.init({ id: "3MMIkpQjaN9YuPlh", ck: "3MMIkpQjaN9YuPlh" });
    </script>
</body>
</html>
